[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
dotenvy = "0.15"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
img-parts = "0.4.0"
object_store = { version = "0.14.2", features = ["aws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 3
