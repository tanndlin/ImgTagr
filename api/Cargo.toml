[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
async_zip = { version = "0.0.19", features = ["tokio", "chrono"] }
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
img-parts = "0.4.0"
kamadak-exif = "0.6.1"
object_store = { version = "0.14.2", features = ["aws"] }
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono"] }
tanlogs-client = { git = "https://github.com/tanndlin/log-ingestor" }
time = { version = "0.3.55", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_lossless = "allow"
cast_sign_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
implicit_hasher = "allow"
