server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /media/ {
        proxy_pass http://s3:9000/imgtagr/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
