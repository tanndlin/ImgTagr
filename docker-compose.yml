services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: imgtagr
      POSTGRES_PASSWORD: imgtagr
      POSTGRES_DB: imgtagr
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgtagr -d imgtagr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://imgtagr:imgtagr@db:5432/imgtagr
      RUST_LOG: api=info,tower_http=info
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  db-data:
